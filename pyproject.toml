[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-llm"
version = "0.1.0"
description = "Thinking with Reasoning Skills pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenAI Codex" }]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
config = ["PyYAML>=6.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
trs = "trs.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
